<head>

<body>
    <div class="noise-overlay"></div>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <nav>
        <div class="nav-hover-pill"></div>
        <div class="nav-links">
            <a href="index.html">Home</a>

            <a href="Certificates.html">Certificates</a>

        </div>
    </nav>

    <main>
        <section id="contact" class="contact">
            <h2 class="reveal">Get In <span class="gradient-text">Touch</span></h2>
            <div class="contact-pad reveal">
                <form id="contact-form">
                    <div class="input-row">
                        <div class="input-group">
                            <input type="text" id="name" placeholder="Name" required>
                        </div>
                        <div class="input-group">
                            <input type="email" id="email" placeholder="Email" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">
                        <span>Send Message</span>
                        <i class='bx bx-paper-plane'></i>
                    </button>
                </form>
            </div>

            <div class="contact-grid reveal">
                <!-- WhatsApp -->
                <a href="tel:+923136823997" class="contact-card">
                    <div class="contact-icon"><i class='bx bxl-whatsapp'></i></div>
                </a>

                <!-- Email -->
                <a href="mailto:noumansajid623@gmail.com" class="contact-card">
                    <div class="contact-icon"><i class='bx bxl-gmail'></i></div>
                </a>

                <!-- GitHub -->
                <a href="https://github.com/alfa546" target="_blank" class="contact-card">
                    <div class="contact-icon"><i class='bx bxl-github'></i></div>
                </a>

                <!-- LinkedIn -->
                <a href="https://www.linkedin.com/in/nouman-sajid-7199803a5?utm_source=share_via&utm_content=profile&utm_medium=member_android"
                    target="_blank" class="contact-card">
                    <div class="contact-icon"><i class='bx bxl-linkedin'></i></div>
                </a>

                <!-- Facebook -->
                <a href="https://www.facebook.com/share/1ByeEF8xDt/" target="_blank" class="contact-card">
                    <div class="contact-icon"><i class='bx bxl-facebook-circle'></i></div>
                </a>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Observer.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
    <script src="script.js"></script>
